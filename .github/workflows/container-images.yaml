---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: Container Images
run-name: >-
  ${{
    case(
      github.event_name == 'push', format('Publish container images for {0}', github.sha),
      format('Validate container images for {0}', github.event.pull_request.title)
    )
  }}

concurrency:
  group: ${{ github.workflow }}:${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# No permissions by default
permissions: {}

defaults:
  run:
    # Error handling and pipefail must be explicitly set via the default shell
    #   https://github.com/actions/runner/issues/353#issuecomment-1067227665
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  find:
    name: Find containers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Discover container directories
        id: discover
        run: |
          containers=$(
            find containers -mindepth 2 -maxdepth 2 -type f -iname Dockerfile -exec dirname {} \; \
            | sed 's|^containers/||' \
            | sort -u
          )

          if [[ -z "${containers}" ]]; then
            echo >&2 "::error title=No containers found::No Dockerfiles were found under the containers/ directory."
            exit 1
          fi

          matrix=$(
            printf '%s\n' "${containers}" \
            | jq --raw-input --slurp --compact-output '{container: split("\n") | map(select(length > 0))}'
          )

          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  build:
    name: ${{ github.event_name == 'push' && 'Publish' || 'Build' }} ${{ matrix.container }}
    needs:
      - find
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJSON(needs.find.outputs.matrix) }}
      fail-fast: false
    environment:
      name: ${{ matrix.container }}
      deployment: ${{ github.event_name == 'push' }}
    env:
      CONTAINER: ${{ matrix.container }}
      IMAGE_NAME: ghcr.io/n3tuk/concourse/${{ matrix.container }}
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,priority=1000
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.container }}
            org.opencontainers.image.description=Concourse CI image ${{ matrix.container }}
          annotations: |
            org.opencontainers.image.title=${{ matrix.container }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/${{ matrix.container }}/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Set up Snyk
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          # TODO: Look into hard-coding of the version used here
          snyk-version: latest

      - name: Configure Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |-
          # snyk config set ...
          snyk config set disableSuggestions=true

      - name: Monitor the image with Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |-
          # snyk container monitor {image}:latest

          snyk container monitor "${IMAGE_NAME}:${IMAGE_TAG}" \
            --org=n3tuk --project-name="${GITHUB_REPOSITORY}/${CONTAINER}" \
            --target-reference="main" \
            --project-environment=internal \
            --project-lifecycle=sandbox \
            --file="containers/${CONTAINER}/Dockerfile"

      - name: Test the image with Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |-
          # snyk container test {image}:latest

          declare -a ARGS
          if test -f "containers/${CONTAINER}/.snyk"; then
            ARGS+=(--policy-path "containers/${CONTAINER}/.snyk")
          fi

          snyk container test "${IMAGE_NAME}:${IMAGE_TAG}" \
            --org=n3tuk --project-name="${GITHUB_REPOSITORY}/${CONTAINER}" \
            --target-reference="${GITHUB_SHA}" --severity-threshold=critical \
            --file="containers/$CONTAINER/Dockerfile" --platform=linux/amd64 \
            "${ARGS[@]}" --trust-policies

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image tags
        if: github.event_name == 'push'
        run: |
          # docker push ...
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${IMAGE_NAME}:latest"
